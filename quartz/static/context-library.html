<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Context Library of Alexandria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes flowLoop {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes flowLoopReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes orbitSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes signalPing {
      0% { r: 4; opacity: 1; }
      100% { r: 12; opacity: 0; }
    }
    .flow-path {
      stroke-dasharray: 8 4;
      animation: flowLoop 2s linear infinite;
    }
    .flow-path-reverse {
      stroke-dasharray: 8 4;
      animation: flowLoop 2s linear infinite reverse;
    }
    .flow-path-slow {
      stroke-dasharray: 8 4;
      animation: flowLoop 3.5s linear infinite;
    }
    .ping-circle {
      animation: signalPing 1.5s ease-out infinite;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ── colour constants ───────────────────────────────────── */
    const GOLD   = '#d4b85c';
    const BLUE   = '#5c8ac9';
    const GREEN  = '#7a9e7a';
    const PURPLE = '#9e7a9e';
    const RED    = '#c95c5c';
    const MUTED  = '#a89f94';
    const DIM    = '#6b635a';
    const CARD_BG = 'rgba(255,255,255,0.03)';
    const CARD_BORDER = 'rgba(255,255,255,0.1)';

    /* ── section colour by slide ────────────────────────────── */
    const sectionColor = (n) => {
      if (n === 0)                        return GOLD;
      if (n >= 1  && n <= 3)              return GOLD;
      if (n >= 4  && n <= 7)              return BLUE;
      if (n >= 8  && n <= 10)             return GREEN;
      if (n >= 11 && n <= 13)             return PURPLE;
      if (n >= 14 && n <= 20)             return RED;
      if (n >= 21 && n <= 23)             return BLUE;
      if (n === 24)                       return GOLD;
      return GOLD;
    };

    /* ═══════════════════════════════════════════════════════════
       SVG LOOP DIAGRAMS
    ═══════════════════════════════════════════════════════════ */

    /* Single loop: Library → Factory → Ships → (back) */
    const SingleLoopSVG = ({ color = BLUE }) => (
      <svg viewBox="0 0 420 260" width="420" height="260" style={{display:'block',margin:'0 auto'}}>
        {/* Circular loop path */}
        <ellipse cx="210" cy="130" rx="170" ry="100" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="40"/>
        <ellipse cx="210" cy="130" rx="170" ry="100" fill="none" stroke={color} strokeWidth="2" opacity="0.3"/>

        {/* Animated flow on top arc */}
        <path d="M 40 130 A 170 100 0 0 1 380 130" fill="none" stroke={color} strokeWidth="2.5" className="flow-path" opacity="0.9"/>
        {/* Animated flow on bottom arc (return) */}
        <path d="M 380 130 A 170 100 0 0 1 40 130" fill="none" stroke={GOLD} strokeWidth="2.5" className="flow-path-reverse" opacity="0.9"/>

        {/* Arrowhead top-right */}
        <polygon points="380,130 368,122 368,138" fill={color} opacity="0.9"/>
        {/* Arrowhead bottom-left */}
        <polygon points="40,130 52,122 52,138" fill={GOLD} opacity="0.9"/>

        {/* Nodes */}
        {/* LIBRARY — left */}
        <circle cx="40" cy="130" r="36" fill="#1a1612" stroke={GOLD} strokeWidth="2"/>
        <text x="40" y="126" textAnchor="middle" fill={GOLD} fontSize="10" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">LIBRARY</text>
        <text x="40" y="140" textAnchor="middle" fill={MUTED} fontSize="9" fontFamily="'Source Sans 3',sans-serif">knowledge</text>

        {/* FACTORY — right */}
        <circle cx="380" cy="130" r="36" fill="#1a1612" stroke={color} strokeWidth="2"/>
        <text x="380" y="126" textAnchor="middle" fill={color} fontSize="10" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">FACTORY</text>
        <text x="380" y="140" textAnchor="middle" fill={MUTED} fontSize="9" fontFamily="'Source Sans 3',sans-serif">prints</text>

        {/* Top label */}
        <text x="210" y="22" textAnchor="middle" fill={color} fontSize="12" fontFamily="'Source Sans 3',sans-serif" opacity="0.8">context flows out</text>

        {/* Bottom label */}
        <text x="210" y="248" textAnchor="middle" fill={GOLD} fontSize="12" fontFamily="'Source Sans 3',sans-serif" opacity="0.8">signal flows back</text>
      </svg>
    );

    /* Complete loop with Marketplace */
    const CompleteLoopSVG = () => (
      <svg viewBox="0 0 500 320" width="500" height="320" style={{display:'block',margin:'0 auto'}}>
        {/* Background ring */}
        <ellipse cx="250" cy="160" rx="210" ry="130" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="50"/>

        {/* Outbound arc (top): Library → Factory → Ships */}
        <path d="M 40 160 A 210 130 0 0 1 460 160" fill="none" stroke={BLUE} strokeWidth="2.5" className="flow-path" opacity="0.85"/>
        {/* Return arc (bottom): Signal → Library */}
        <path d="M 460 160 A 210 130 0 0 1 40 160" fill="none" stroke={GOLD} strokeWidth="2.5" className="flow-path-reverse" opacity="0.85"/>

        {/* Arrowheads */}
        <polygon points="460,160 446,151 446,169" fill={BLUE} opacity="0.9"/>
        <polygon points="40,160 54,151 54,169" fill={GOLD} opacity="0.9"/>

        {/* LIBRARY */}
        <circle cx="40" cy="160" r="38" fill="#1a1612" stroke={GOLD} strokeWidth="2.5"/>
        <text x="40" y="156" textAnchor="middle" fill={GOLD} fontSize="9.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">LIBRARY</text>
        <text x="40" y="170" textAnchor="middle" fill={MUTED} fontSize="8.5" fontFamily="'Source Sans 3',sans-serif">updates</text>

        {/* Top middle node: FACTORY */}
        <circle cx="250" cy="30" r="34" fill="#1a1612" stroke={BLUE} strokeWidth="2"/>
        <text x="250" y="26" textAnchor="middle" fill={BLUE} fontSize="9.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">FACTORY</text>
        <text x="250" y="40" textAnchor="middle" fill={MUTED} fontSize="8.5" fontFamily="'Source Sans 3',sans-serif">prints</text>

        {/* MARKETPLACE */}
        <circle cx="460" cy="160" r="38" fill="#1a1612" stroke={GREEN} strokeWidth="2.5"/>
        <text x="460" y="156" textAnchor="middle" fill={GREEN} fontSize="9.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">MARKET</text>
        <text x="460" y="170" textAnchor="middle" fill={MUTED} fontSize="8.5" fontFamily="'Source Sans 3',sans-serif">responds</text>

        {/* Bottom middle: SIGNAL */}
        <circle cx="250" cy="290" r="34" fill="#1a1612" stroke={GOLD} strokeWidth="2"/>
        <text x="250" y="286" textAnchor="middle" fill={GOLD} fontSize="9.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">SIGNAL</text>
        <text x="250" y="300" textAnchor="middle" fill={MUTED} fontSize="8.5" fontFamily="'Source Sans 3',sans-serif">flows back</text>

        {/* Ping dots on signal node */}
        <circle cx="250" cy="290" r="4" fill={GOLD} opacity="0.9"/>
        <circle cx="250" cy="290" r="4" fill={GOLD} className="ping-circle" opacity="0"/>
      </svg>
    );

    /* Two loops connected: shared library, two factories */
    const TwoLoopsSVG = () => (
      <svg viewBox="0 0 560 300" width="560" height="300" style={{display:'block',margin:'0 auto'}}>
        {/* Left loop */}
        <ellipse cx="180" cy="150" rx="140" ry="90" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="35"/>
        <path d="M 40 150 A 140 90 0 0 1 320 150" fill="none" stroke={BLUE} strokeWidth="2" className="flow-path" opacity="0.8"/>
        <path d="M 320 150 A 140 90 0 0 1 40 150" fill="none" stroke={GOLD} strokeWidth="2" className="flow-path-reverse" opacity="0.6"/>
        <polygon points="320,150 308,143 308,157" fill={BLUE} opacity="0.8"/>
        <polygon points="40,150 52,143 52,157" fill={GOLD} opacity="0.7"/>

        {/* Right loop */}
        <ellipse cx="380" cy="150" rx="140" ry="90" fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth="35"/>
        <path d="M 240 150 A 140 90 0 0 1 520 150" fill="none" stroke={GREEN} strokeWidth="2" className="flow-path-slow" opacity="0.8"/>
        <path d="M 520 150 A 140 90 0 0 1 240 150" fill="none" stroke={GOLD} strokeWidth="2" className="flow-path" opacity="0.6"/>
        <polygon points="520,150 508,143 508,157" fill={GREEN} opacity="0.8"/>
        <polygon points="240,150 252,143 252,157" fill={GOLD} opacity="0.7"/>

        {/* Shared LIBRARY node (center) */}
        <circle cx="280" cy="150" r="42" fill="#1a1612" stroke={GOLD} strokeWidth="2.5"/>
        <text x="280" y="146" textAnchor="middle" fill={GOLD} fontSize="9" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="0.8">SHARED</text>
        <text x="280" y="158" textAnchor="middle" fill={GOLD} fontSize="9" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="0.8">LIBRARY</text>

        {/* Left FACTORY */}
        <circle cx="40" cy="150" r="34" fill="#1a1612" stroke={BLUE} strokeWidth="2"/>
        <text x="40" y="146" textAnchor="middle" fill={BLUE} fontSize="8.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif">FACTORY</text>
        <text x="40" y="159" textAnchor="middle" fill={MUTED} fontSize="8" fontFamily="'Source Sans 3',sans-serif">software</text>

        {/* Right FACTORY */}
        <circle cx="520" cy="150" r="34" fill="#1a1612" stroke={GREEN} strokeWidth="2"/>
        <text x="520" y="146" textAnchor="middle" fill={GREEN} fontSize="8.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif">FACTORY</text>
        <text x="520" y="159" textAnchor="middle" fill={MUTED} fontSize="8" fontFamily="'Source Sans 3',sans-serif">marketing</text>

        {/* Labels */}
        <text x="145" y="20" textAnchor="middle" fill={BLUE} fontSize="11" fontFamily="'Source Sans 3',sans-serif" opacity="0.7">same context</text>
        <text x="415" y="20" textAnchor="middle" fill={GREEN} fontSize="11" fontFamily="'Source Sans 3',sans-serif" opacity="0.7">different output</text>
      </svg>
    );

    /* Federation: split library */
    const FederationSVG = () => (
      <svg viewBox="0 0 580 340" width="580" height="340" style={{display:'block',margin:'0 auto'}}>
        {/* Corporate library at top */}
        <rect x="210" y="10" width="160" height="60" rx="12" fill="#1a1612" stroke={GOLD} strokeWidth="2"/>
        <text x="290" y="36" textAnchor="middle" fill={GOLD} fontSize="10" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">CORPORATE</text>
        <text x="290" y="52" textAnchor="middle" fill={MUTED} fontSize="9" fontFamily="'Source Sans 3',sans-serif">strategy · identity · bets</text>

        {/* WHY chains down */}
        <line x1="230" y1="70" x2="150" y2="130" stroke={GOLD} strokeWidth="1.5" strokeDasharray="5 3" opacity="0.6"/>
        <line x1="350" y1="70" x2="430" y2="130" stroke={GOLD} strokeWidth="1.5" strokeDasharray="5 3" opacity="0.6"/>

        {/* Left specialized library */}
        <rect x="70" y="130" width="160" height="60" rx="12" fill="#1a1612" stroke={BLUE} strokeWidth="2"/>
        <text x="150" y="156" textAnchor="middle" fill={BLUE} fontSize="10" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">SOFTWARE</text>
        <text x="150" y="172" textAnchor="middle" fill={MUTED} fontSize="9" fontFamily="'Source Sans 3',sans-serif">library</text>

        {/* Right specialized library */}
        <rect x="350" y="130" width="160" height="60" rx="12" fill="#1a1612" stroke={GREEN} strokeWidth="2"/>
        <text x="430" y="156" textAnchor="middle" fill={GREEN} fontSize="10" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">COMMS</text>
        <text x="430" y="172" textAnchor="middle" fill={MUTED} fontSize="9" fontFamily="'Source Sans 3',sans-serif">library</text>

        {/* Left loop */}
        <path d="M 70 160 A 80 55 0 0 0 70 265" fill="none" stroke={BLUE} strokeWidth="1.8" className="flow-path" opacity="0.7"/>
        <path d="M 70 265 A 80 55 0 0 0 70 160" fill="none" stroke={GOLD} strokeWidth="1.8" className="flow-path-reverse" opacity="0.5"/>

        {/* Left factory */}
        <circle cx="38" cy="212" r="28" fill="#1a1612" stroke={BLUE} strokeWidth="1.8"/>
        <text x="38" y="208" textAnchor="middle" fill={BLUE} fontSize="8" fontWeight="700" fontFamily="'Source Sans 3',sans-serif">SOFT</text>
        <text x="38" y="220" textAnchor="middle" fill={MUTED} fontSize="7.5" fontFamily="'Source Sans 3',sans-serif">factory</text>

        {/* Right loop */}
        <path d="M 510 160 A 80 55 0 0 1 510 265" fill="none" stroke={GREEN} strokeWidth="1.8" className="flow-path-slow" opacity="0.7"/>
        <path d="M 510 265 A 80 55 0 0 1 510 160" fill="none" stroke={GOLD} strokeWidth="1.8" className="flow-path-reverse" opacity="0.5"/>

        {/* Right factory */}
        <circle cx="542" cy="212" r="28" fill="#1a1612" stroke={GREEN} strokeWidth="1.8"/>
        <text x="542" y="208" textAnchor="middle" fill={GREEN} fontSize="8" fontWeight="700" fontFamily="'Source Sans 3',sans-serif">COMMS</text>
        <text x="542" y="220" textAnchor="middle" fill={MUTED} fontSize="7.5" fontFamily="'Source Sans 3',sans-serif">factory</text>

        {/* WHY label */}
        <text x="185" y="105" textAnchor="middle" fill={GOLD} fontSize="9" fontFamily="'Source Sans 3',sans-serif" opacity="0.6">WHY chain</text>
        <text x="395" y="105" textAnchor="middle" fill={GOLD} fontSize="9" fontFamily="'Source Sans 3',sans-serif" opacity="0.6">WHY chain</text>

        {/* Shared label */}
        <text x="290" y="118" textAnchor="middle" fill={GOLD} fontSize="10" fontFamily="'Source Sans 3',sans-serif" opacity="0.5">shared bet</text>

        {/* Signal flows back up - dashed lines */}
        <line x1="150" y1="130" x2="240" y2="70" stroke={MUTED} strokeWidth="1" strokeDasharray="3 4" opacity="0.35"/>
        <line x1="430" y1="130" x2="340" y2="70" stroke={MUTED} strokeWidth="1" strokeDasharray="3 4" opacity="0.35"/>
        <text x="180" y="115" textAnchor="middle" fill={MUTED} fontSize="7" fontFamily="'Source Sans 3',sans-serif" opacity="0.4">signal</text>
        <text x="400" y="115" textAnchor="middle" fill={MUTED} fontSize="7" fontFamily="'Source Sans 3',sans-serif" opacity="0.4">signal</text>
      </svg>
    );

    /* Orbital: many factories around a library */
    const OrbitalSVG = () => (
      <svg viewBox="0 0 440 440" width="400" height="400" style={{display:'block',margin:'0 auto'}}>
        {/* Orbital rings */}
        <circle cx="220" cy="220" r="155" fill="none" stroke="rgba(255,255,255,0.05)" strokeWidth="30"/>
        <circle cx="220" cy="220" r="155" fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth="1"/>

        {/* Animated flow ring */}
        <circle cx="220" cy="220" r="155" fill="none" stroke={BLUE} strokeWidth="2" strokeDasharray="12 6" className="flow-path" opacity="0.5"/>

        {/* Center corporate library */}
        <circle cx="220" cy="220" r="48" fill="#1a1612" stroke={GOLD} strokeWidth="2.5"/>
        <text x="220" y="214" textAnchor="middle" fill={GOLD} fontSize="10" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">CONTEXT</text>
        <text x="220" y="228" textAnchor="middle" fill={GOLD} fontSize="10" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="1">LIBRARY</text>
        <text x="220" y="242" textAnchor="middle" fill={MUTED} fontSize="8.5" fontFamily="'Source Sans 3',sans-serif">shared knowledge</text>

        {/* 8 factories in orbit */}
        {[
          { angle: 0,    label: 'SOFTWARE',  color: BLUE,   sub: 'code' },
          { angle: 45,   label: 'DOCS',      color: BLUE,   sub: 'prose' },
          { angle: 90,   label: 'MARKETING', color: GREEN,  sub: 'campaigns' },
          { angle: 135,  label: 'SALES',     color: GREEN,  sub: 'decks' },
          { angle: 180,  label: 'RESEARCH',  color: PURPLE, sub: 'papers' },
          { angle: 225,  label: 'MEDIA',     color: PURPLE, sub: 'video' },
          { angle: 270,  label: 'DESIGN',    color: RED,    sub: 'assets' },
          { angle: 315,  label: 'OPS',       color: RED,    sub: 'plans' },
        ].map(({ angle, label, color, sub }) => {
          const rad = (angle * Math.PI) / 180;
          const cx = 220 + 155 * Math.cos(rad);
          const cy = 220 + 155 * Math.sin(rad);
          /* spoke line from center to node */
          const spokeCX = 220 + 68 * Math.cos(rad);
          const spokeCY = 220 + 68 * Math.sin(rad);
          const spokeEx = 220 + 128 * Math.cos(rad);
          const spokeEy = 220 + 128 * Math.sin(rad);
          return (
            <g key={angle}>
              <line x1={spokeCX} y1={spokeCY} x2={spokeEx} y2={spokeEy}
                stroke={color} strokeWidth="1" strokeDasharray="3 3" opacity="0.4"/>
              <circle cx={cx} cy={cy} r="26" fill="#1a1612" stroke={color} strokeWidth="1.8"/>
              <text x={cx} y={cy - 4} textAnchor="middle" fill={color} fontSize="7.5" fontWeight="700"
                fontFamily="'Source Sans 3',sans-serif" letterSpacing="0.5">{label}</text>
              <text x={cx} y={cy + 9} textAnchor="middle" fill={MUTED} fontSize="7"
                fontFamily="'Source Sans 3',sans-serif">{sub}</text>
            </g>
          );
        })}
      </svg>
    );

    /* WHY chain diagram */
    const WhyChainSVG = () => (
      <svg viewBox="0 0 420 260" width="420" height="260" style={{display:'block',margin:'0 auto'}}>
        {/* Vertical chain */}
        {[
          { y: 20,  label: 'COMPANY BET',   sub: 'strategic thesis',     color: GOLD },
          { y: 90,  label: 'PRODUCT THESIS', sub: 'why this product',    color: PURPLE },
          { y: 160, label: 'PRINCIPLE',      sub: 'design constraint',   color: BLUE },
          { y: 230, label: 'CARD',           sub: 'factory instruction', color: GREEN },
        ].map(({ y, label, sub, color }, i) => (
          <g key={i}>
            <rect x="110" y={y} width="200" height="50" rx="10" fill="#1a1612" stroke={color} strokeWidth="1.8"/>
            <text x="210" y={y + 22} textAnchor="middle" fill={color} fontSize="11" fontWeight="700"
              fontFamily="'Source Sans 3',sans-serif" letterSpacing="0.8">{label}</text>
            <text x="210" y={y + 38} textAnchor="middle" fill={MUTED} fontSize="10"
              fontFamily="'Source Sans 3',sans-serif">{sub}</text>
            {i < 3 && (
              <>
                <line x1="210" y1={y + 50} x2="210" y2={y + 68} stroke={GOLD} strokeWidth="1.5" strokeDasharray="4 3" opacity="0.6"/>
                <text x="250" y={y + 63} fill={GOLD} fontSize="9" fontFamily="'Source Sans 3',sans-serif" opacity="0.7">WHY</text>
              </>
            )}
          </g>
        ))}
        {/* Signal going back up */}
        <path d="M 80 280 A 40 120 0 0 1 80 20" fill="none" stroke={GOLD} strokeWidth="1.5" className="flow-path-reverse" opacity="0.5"/>
        <polygon points="80,20 74,32 86,32" fill={GOLD} opacity="0.5"/>
        <text x="52" y="155" textAnchor="middle" fill={GOLD} fontSize="9" fontFamily="'Source Sans 3',sans-serif" opacity="0.5" transform="rotate(-90, 52, 155)">signal</text>
      </svg>
    );

    /* Bridge agents between nodes */
    const BridgeSVG = () => (
      <svg viewBox="0 0 480 200" width="480" height="200" style={{display:'block',margin:'0 auto'}}>
        {/* Left node */}
        <circle cx="80" cy="100" r="50" fill="#1a1612" stroke={GOLD} strokeWidth="2"/>
        <text x="80" y="96" textAnchor="middle" fill={GOLD} fontSize="9.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="0.8">LIBRARY</text>
        <text x="80" y="110" textAnchor="middle" fill={MUTED} fontSize="8.5" fontFamily="'Source Sans 3',sans-serif">node A</text>

        {/* Right node */}
        <circle cx="400" cy="100" r="50" fill="#1a1612" stroke={BLUE} strokeWidth="2"/>
        <text x="400" y="96" textAnchor="middle" fill={BLUE} fontSize="9.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="0.8">FACTORY</text>
        <text x="400" y="110" textAnchor="middle" fill={MUTED} fontSize="8.5" fontFamily="'Source Sans 3',sans-serif">node B</text>

        {/* Bridge agent in center */}
        <circle cx="240" cy="100" r="36" fill="#1a1612" stroke={PURPLE} strokeWidth="2"/>
        <text x="240" y="96" textAnchor="middle" fill={PURPLE} fontSize="9.5" fontWeight="700" fontFamily="'Source Sans 3',sans-serif" letterSpacing="0.5">BRIDGET</text>
        <text x="240" y="110" textAnchor="middle" fill={MUTED} fontSize="8" fontFamily="'Source Sans 3',sans-serif">assembles</text>

        {/* Flows */}
        <path d="M 130 85 Q 185 65 204 84" fill="none" stroke={GOLD} strokeWidth="2" className="flow-path" opacity="0.8"/>
        <polygon points="204,84 194,78 198,89" fill={GOLD} opacity="0.8"/>

        <path d="M 276 84 Q 295 65 350 85" fill="none" stroke={BLUE} strokeWidth="2" className="flow-path-slow" opacity="0.8"/>
        <polygon points="350,85 338,80 342,91" fill={BLUE} opacity="0.8"/>

        {/* Signal return */}
        <path d="M 350 115 Q 295 135 276 116" fill="none" stroke={MUTED} strokeWidth="1.5" strokeDasharray="4 3" opacity="0.5"/>
        <polygon points="276,116 288,122 284,111" fill={MUTED} opacity="0.5"/>

        <text x="240" y="180" textAnchor="middle" fill={MUTED} fontSize="10" fontFamily="'Source Sans 3',sans-serif" opacity="0.7">Bridget pulls context · gaps feed back</text>
      </svg>
    );

    /* Full federated smart company */
    const SmartCompanySVG = () => (

    /* ═══════════════════════════════════════════════════════════
       PRESENTATION SHELL
    ═══════════════════════════════════════════════════════════ */

    const Presentation = () => {
      const [currentSlide, setCurrentSlide] = useState(0);
      const totalSlides = slides.length;

      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'ArrowRight' || e.key === ' ') {
            e.preventDefault();
            setCurrentSlide(prev => Math.min(prev + 1, totalSlides - 1));
          } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            setCurrentSlide(prev => Math.max(prev - 1, 0));
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [totalSlides]);

      const activeColor = sectionColor(currentSlide);

      const shellStyles = `
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
          font-family: 'Source Sans 3', sans-serif;
          background: linear-gradient(145deg, #1a1612 0%, #2d2620 100%);
          color: #f5f0e8;
          overflow: hidden;
        }
        h1, h2, h3 { font-family: 'Fraunces', serif; }
        .slide-container {
          width: 100vw;
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 50px 60px 90px 60px;
        }
        .slide {
          max-width: 1200px;
          width: 100%;
          animation: fadeIn 0.4s ease-out;
        }
        .nav-bar {
          position: fixed;
          bottom: 0; left: 0; right: 0;
          background: rgba(26,22,18,0.97);
          border-top: 1px solid rgba(255,255,255,0.08);
          padding: 16px 40px;
          display: flex;
          align-items: center;
          justify-content: space-between;
        }
        .nav-button {
          background: rgba(255,255,255,0.05);
          border: 1px solid rgba(255,255,255,0.18);
          color: #f5f0e8;
          padding: 9px 22px;
          border-radius: 8px;
          cursor: pointer;
          font-family: 'Source Sans 3', sans-serif;
          font-size: 15px;
          transition: all 0.2s;
        }
        .nav-button:hover:not(:disabled) { background: rgba(255,255,255,0.1); }
        .nav-button:disabled { opacity: 0.3; cursor: not-allowed; }
        .progress-dots {
          display: flex; gap: 9px; flex-wrap: wrap;
          justify-content: center; max-width: 600px;
        }
        .dot {
          width: 9px; height: 9px; border-radius: 50%;
          background: rgba(255,255,255,0.18);
          transition: all 0.3s; cursor: pointer;
        }
        .dot:hover { background: rgba(255,255,255,0.4); }
        .slide-counter {
          font-size: 13px;
          color: ${DIM};
          letter-spacing: 1px;
          min-width: 80px;
          text-align: right;
        }
      `;

      return (
        <>
          <style>{shellStyles}</style>
          <div className="slide-container">
            <div className="slide" key={currentSlide}>
              {slides[currentSlide].content}
            </div>
          </div>
          <div className="nav-bar">
            <button
              className="nav-button"
              onClick={() => setCurrentSlide(prev => Math.max(prev - 1, 0))}
              disabled={currentSlide === 0}
            >← Back</button>
            <div className="progress-dots">
              {slides.map((_, i) => (
                <div
                  key={i}
                  className="dot"
                  onClick={() => setCurrentSlide(i)}
                  style={{
                    background: i === currentSlide ? sectionColor(i) : 'rgba(255,255,255,0.18)',
                    transform: i === currentSlide ? 'scale(1.4)' : 'scale(1)',
                  }}
                />
              ))}
            </div>
            <div className="slide-counter">{currentSlide + 1} / {totalSlides}</div>
            <button
              className="nav-button"
              onClick={() => setCurrentSlide(prev => Math.min(prev + 1, totalSlides - 1))}
              disabled={currentSlide === totalSlides - 1}
            >Next →</button>
          </div>
        </>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Presentation />);
  </script>
