<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeBuild - Dynamic Life Map</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Life Category Colors */
      --health: #4CAF50;
      --purpose: #5C4B8A;
      --finances: #D4A017;
      --relationships: #E57373;
      --home: #A1887F;
      --community: #FF7043;
      --leisure: #64B5F6;
      --growth: #26A69A;

      /* Stream Colors */
      --gold: #D4A017;
      --gold-bg: rgba(212, 160, 23, 0.08);
      --gold-light: #F4D03F;
      --silver: #C0C0C0;
      --silver-bg: rgba(192, 192, 192, 0.08);
      --silver-light: #E8E8E8;
      --bronze: #CD7F32;
      --bronze-bg: rgba(205, 127, 50, 0.08);
      --bronze-light: #DDA15E;

      /* UI Colors */
      --bg-dark: #1a1a1a;
      --bg-card: #2a2a2a;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 8px var(--gold), 0 0 16px rgba(212, 160, 23, 0.3); }
      50% { box-shadow: 0 0 16px var(--gold), 0 0 32px rgba(212, 160, 23, 0.5); }
    }

    @keyframes pulse-silver {
      0%, 100% { box-shadow: 0 0 8px var(--silver), 0 0 16px rgba(192, 192, 192, 0.3); }
      50% { box-shadow: 0 0 16px var(--silver), 0 0 32px rgba(192, 192, 192, 0.5); }
    }

    /* ===== THE TABLE ===== */
    .the-table {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(180deg, #1a1a1a 0%, #1a1a1a 85%, transparent 100%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 12px 24px;
    }

    .table-slot {
      flex: 1;
      max-width: 240px;
      height: 70px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      position: relative;
    }

    .table-slot.gold {
      background: linear-gradient(135deg, rgba(212, 160, 23, 0.15) 0%, rgba(212, 160, 23, 0.05) 100%);
      border: 2px solid var(--gold);
      animation: pulse-gold 2s ease-in-out infinite;
    }

    .table-slot.silver {
      background: linear-gradient(135deg, rgba(192, 192, 192, 0.15) 0%, rgba(192, 192, 192, 0.05) 100%);
      border: 2px solid var(--silver);
      animation: pulse-silver 2s ease-in-out infinite;
    }

    .table-slot.bronze {
      background: linear-gradient(135deg, rgba(205, 127, 50, 0.15) 0%, rgba(205, 127, 50, 0.05) 100%);
      border: 2px solid var(--bronze);
      box-shadow: 0 0 15px rgba(205, 127, 50, 0.2);
    }

    .slot-label {
      position: absolute;
      top: -8px;
      left: 12px;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 3px;
      background: var(--bg-dark);
    }

    .gold .slot-label { color: var(--gold); }
    .silver .slot-label { color: var(--silver); }
    .bronze .slot-label { color: var(--bronze); }

    .slot-content {
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      opacity: 0.95;
    }

    .slot-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      border: 2px solid currentColor;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(0,0,0,0.35);
    }

    .table-slot.gold .slot-avatar { border-color: var(--gold); }
    .table-slot.silver .slot-avatar { border-color: var(--silver); }
    .table-slot.bronze .slot-avatar { border-color: var(--bronze); }

    .slot-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .slot-project-name {
      font-size: 12px;
      margin-bottom: 0;
    }

    .slot-meta {
      font-size: 10px;
      color: var(--text-secondary);
    }

    /* ===== SORT CONTROLS ===== */
    .sort-controls {
      position: fixed;
      top: 100px;
      left: 0;
      right: 0;
      height: 50px;
      background: var(--bg-dark);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 99;
      padding: 0 24px;
    }

    .sort-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-right: 8px;
    }

    .sort-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sort-btn:hover {
      border-color: rgba(255,255,255,0.4);
      color: var(--text-primary);
    }

    .sort-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .sort-divider {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.2);
      margin: 0 8px;
    }

    /* ===== LIFE MAP CANVAS ===== */
    .life-map-canvas {
      padding-top: 170px;
      padding-bottom: 40px;
      min-height: 100vh;
      position: relative;
    }

    /* ===== SORT REGIONS (Dynamic Backgrounds) ===== */
    .sort-regions {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }

    .region {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
      transition: all 0.5s ease;
      border-radius: 12px;
      margin: 8px;
    }

    .region-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.6;
      margin-bottom: 8px;
    }

    .region-sublabel {
      font-size: 10px;
      opacity: 0.4;
    }

    /* Stream region colors */
    .region.gold { background: var(--gold-bg); border: 1px solid rgba(212, 160, 23, 0.2); }
    .region.gold .region-label { color: var(--gold); }

    .region.silver { background: var(--silver-bg); border: 1px solid rgba(192, 192, 192, 0.2); }
    .region.silver .region-label { color: var(--silver); }

    .region.bronze { background: var(--bronze-bg); border: 1px solid rgba(205, 127, 50, 0.2); }
    .region.bronze .region-label { color: var(--bronze); }

    /* Category region colors */
    .region.cat-health { background: rgba(76, 175, 80, 0.08); border: 1px solid rgba(76, 175, 80, 0.2); }
    .region.cat-health .region-label { color: var(--health); }

    .region.cat-relationships { background: rgba(229, 115, 115, 0.08); border: 1px solid rgba(229, 115, 115, 0.2); }
    .region.cat-relationships .region-label { color: var(--relationships); }

    .region.cat-home { background: rgba(161, 136, 127, 0.08); border: 1px solid rgba(161, 136, 127, 0.2); }
    .region.cat-home .region-label { color: var(--home); }

    .region.cat-leisure { background: rgba(100, 181, 246, 0.08); border: 1px solid rgba(100, 181, 246, 0.2); }
    .region.cat-leisure .region-label { color: var(--leisure); }

    .region.cat-community { background: rgba(255, 112, 67, 0.08); border: 1px solid rgba(255, 112, 67, 0.2); }
    .region.cat-community .region-label { color: var(--community); }

    .region.cat-growth { background: rgba(38, 166, 154, 0.08); border: 1px solid rgba(38, 166, 154, 0.2); }
    .region.cat-growth .region-label { color: var(--growth); }

    .region.cat-finances { background: rgba(212, 160, 23, 0.08); border: 1px solid rgba(212, 160, 23, 0.2); }
    .region.cat-finances .region-label { color: var(--finances); }

    .region.cat-purpose { background: rgba(92, 75, 138, 0.08); border: 1px solid rgba(92, 75, 138, 0.2); }
    .region.cat-purpose .region-label { color: var(--purpose); }

    /* Active/Ongoing region styling */
    .region.active-region { 
      background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, transparent 100%);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .region.active-region .region-label { color: var(--text-primary); }

    .region.ongoing-region { 
      background: linear-gradient(0deg, rgba(255,255,255,0.02) 0%, transparent 100%);
      border: 1px solid rgba(255,255,255,0.05);
    }
    .region.ongoing-region .region-label { color: var(--text-secondary); }

    /* ===== PROJECTS CONTAINER ===== */
    .projects-container {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      min-height: 600px;
    }

    /* ===== PROJECT DOTS ===== */
    .project-dot {
      position: absolute;
      border-radius: 50%;
      background-color: var(--bg-dark);
      border: 3px solid var(--project-color);
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      z-index: 10;
    }

    .project-dot.size-small { width: 44px; height: 44px; }
    .project-dot.size-medium { width: 64px; height: 64px; }
    .project-dot.size-large { width: 80px; height: 80px; }

    .project-dot:hover {
      transform: scale(1.2);
      z-index: 20;
    }

    .project-dot.work-at-hand.stream-gold {
      animation: pulse-gold 2s ease-in-out infinite;
    }

    .project-dot.work-at-hand.stream-silver {
      animation: pulse-silver 2s ease-in-out infinite;
    }

    .project-dot.plans {
      opacity: 0.5;
      border-style: dashed;
    }

    .project-dot.paused {
      opacity: 0.3;
      filter: grayscale(70%);
    }

    .project-image {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background-size: cover;
      background-position: center;
      filter: saturate(0.95) brightness(0.85);
      transition: filter 0.3s ease;
    }

    .project-dot:hover .project-image {
      filter: saturate(1.05) brightness(1);
    }

    .gradient-fill {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      opacity: 0.6;
      pointer-events: none;
    }

    .hover-label {
      position: absolute;
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.2s ease;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
      pointer-events: none;
      padding: 4px 8px;
      background: rgba(0,0,0,0.7);
      border-radius: 4px;
    }

    .project-dot.stream-gold .hover-label { color: var(--gold-light); }
    .project-dot.stream-silver .hover-label { color: var(--silver-light); }
    .project-dot.stream-bronze .hover-label { color: var(--bronze-light); }

    .project-dot:hover .hover-label {
      opacity: 1;
    }

    /* Category color indicator dot */
    .category-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid var(--bg-dark);
      background: var(--project-color);
    }

    /* ===== PROJECT BOARD OVERLAY ===== */
    .project-board-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      background: rgba(0,0,0,0.6);
    }

    .project-board-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .project-board {
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      background: var(--bg-card);
      border-radius: 20px;
      padding: 32px;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
    }

    .project-board-overlay.active .project-board {
      transform: scale(1) translateY(0);
    }

    .board-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .board-image {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid var(--project-color);
      overflow: hidden;
      flex-shrink: 0;
    }

    .board-image .project-image {
      border-radius: 50%;
    }

    .board-title-section { flex: 1; }

    .board-project-title {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .board-project-title.stream-gold { color: var(--gold-light); }
    .board-project-title.stream-silver { color: var(--silver-light); }
    .board-project-title.stream-bronze { color: var(--bronze-light); }

    .board-meta {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .board-category-badge {
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
    }

    .board-stream-badge {
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .board-stream-badge.gold { background: var(--gold); color: #000; }
    .board-stream-badge.silver { background: var(--silver); color: #000; }
    .board-stream-badge.bronze { background: var(--bronze); color: #000; }

    .board-progress {
      text-align: right;
    }

    .board-progress-value {
      font-size: 28px;
      font-weight: 700;
    }

    .board-progress-label {
      font-size: 10px;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .kanban-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .kanban-column {
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 16px;
      min-height: 150px;
    }

    .column-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .task-card {
      background: var(--bg-card);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 12px;
      border-left: 3px solid var(--project-color);
    }

    .close-board {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text-primary);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .close-board:hover {
      background: rgba(255,255,255,0.2);
    }

    /* ===== ROW LABELS ===== */
    .row-label {
      position: absolute;
      left: -80px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-secondary);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
    }

    /* ===== LEGEND ===== */
    .legend {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-card);
      border-radius: 12px;
      padding: 16px;
      font-size: 11px;
      z-index: 50;
    }

    .legend-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid;
    }

    .legend-dot.large { width: 20px; height: 20px; }
    .legend-dot.medium { width: 16px; height: 16px; }
    .legend-dot.small { width: 12px; height: 12px; }
  </style>
</head>
<body>

  <!-- The Table -->
  <div class="the-table">
    <div class="table-slot gold" data-project-id="ho1">
      <span class="slot-label">Gold</span>
      <div class="slot-content">
        <div class="slot-avatar" aria-hidden="true"></div>
        <div class="slot-text">
          <div class="slot-project-name">Kitchen Renovation</div>
          <div class="slot-meta">Home • 42%</div>
        </div>
      </div>
    </div>
    <div class="table-slot silver" data-project-id="h1">
      <span class="slot-label">Silver</span>
      <div class="slot-content">
        <div class="slot-avatar" aria-hidden="true"></div>
        <div class="slot-text">
          <div class="slot-project-name">Morning Routine</div>
          <div class="slot-meta">Health • 35%</div>
        </div>
      </div>
    </div>
    <div class="table-slot bronze" data-fallback-image="https://images.unsplash.com/photo-1506784365847-bbad939e9335?w=200&h=200&fit=crop">
      <span class="slot-label">Bronze</span>
      <div class="slot-content">
        <div class="slot-avatar" aria-hidden="true"></div>
        <div class="slot-text">
          <div class="slot-project-name">8 tasks</div>
          <div class="slot-meta">34 queued</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sort Controls -->
  <div class="sort-controls">
    <span class="sort-label">Sort by:</span>
    <button class="sort-btn active" data-sort="compound">Active × Stream</button>
    <button class="sort-btn" data-sort="stream">Stream Only</button>
    <button class="sort-btn" data-sort="category">Category</button>
    <button class="sort-btn" data-sort="status">Active / Ongoing</button>
  </div>

  <!-- Life Map Canvas -->
  <div class="life-map-canvas">
    <div class="sort-regions" id="sortRegions">
      <!-- Dynamic regions rendered by JS -->
    </div>
    <div class="projects-container" id="projectsContainer">
      <!-- Projects rendered by JS -->
    </div>
  </div>

  <!-- Project Board Overlay -->
  <div class="project-board-overlay" id="projectBoardOverlay">
    <div class="project-board" id="projectBoard">
      <button class="close-board" onclick="closeBoard()">×</button>
      <!-- Content rendered by JS -->
    </div>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-title">Project Size = Scope</div>
    <div class="legend-item">
      <div class="legend-dot large" style="border-color: var(--gold);"></div>
      <span>Gold (Transformative)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot medium" style="border-color: var(--silver);"></div>
      <span>Silver (Capacity)</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot small" style="border-color: var(--bronze);"></div>
      <span>Bronze (Operational)</span>
    </div>
  </div>

  <script>
    // ===== GRADIENT GENERATOR =====
    function generateGradient(seed, color) {
      const gradients = [
        `radial-gradient(circle at 30% 30%, ${color}66 0%, transparent 50%), 
         radial-gradient(circle at 70% 70%, ${color}44 0%, transparent 40%), 
         linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%)`,
        `radial-gradient(ellipse at 50% 0%, ${color}77 0%, transparent 60%), 
         linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 100%)`,
        `conic-gradient(from 180deg at 50% 50%, ${color}33, transparent, ${color}33), 
         radial-gradient(circle, #2a2a2a 0%, #1a1a1a 100%)`,
        `radial-gradient(circle at 20% 80%, ${color}55 0%, transparent 40%), 
         radial-gradient(circle at 80% 20%, ${color}44 0%, transparent 30%), 
         linear-gradient(45deg, #1a1a1a 0%, #252525 100%)`,
        `linear-gradient(135deg, ${color}44 0%, transparent 50%), 
         radial-gradient(circle at 100% 100%, ${color}33 0%, transparent 50%), 
         linear-gradient(225deg, #2a2a2a 0%, #1a1a1a 100%)`,
      ];
      return gradients[seed % gradients.length];
    }

    // ===== DATA =====
    const categoryColors = {
      health: '#4CAF50',
      relationships: '#E57373',
      home: '#A1887F',
      leisure: '#64B5F6',
      community: '#FF7043',
      growth: '#26A69A',
      finances: '#D4A017',
      purpose: '#5C4B8A'
    };

    const categoryNames = {
      health: 'Health',
      relationships: 'Relationships',
      home: 'Home',
      leisure: 'Leisure',
      community: 'Community',
      growth: 'Growth',
      finances: 'Finances',
      purpose: 'Purpose'
    };

    const projects = [
      // Health
      { id: 'h1', name: 'Morning Routine System', category: 'health', status: 'live', progress: 35, stream: 'silver', scale: 'medium', workAtHand: true, isActive: true,
        image: 'https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?w=200&h=200&fit=crop',
        tasks: { todo: ['Review sleep data', 'Adjust wake time'], inProgress: ['Track morning energy'], done: ['Set up tracking app'] }},
      { id: 'h2', name: 'Annual Physical', category: 'health', status: 'plans', progress: 0, stream: 'bronze', scale: 'small', workAtHand: false, isActive: false,
        image: 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=200&h=200&fit=crop',
        tasks: { todo: ['Schedule appointment', 'List concerns'], inProgress: [], done: [] }},

    function getProjectById(projectId) {
      return projects.find(p => p.id === projectId) ?? null;
    }

    function applyTableImages() {
      document.querySelectorAll('.table-slot').forEach(slot => {
        const avatar = slot.querySelector('.slot-avatar');
        if (!avatar) return;
        let imageUrl = null;
        const { projectId, fallbackImage } = slot.dataset;
        if (projectId) {
          const proj = getProjectById(projectId);
          if (proj && proj.image) {
            imageUrl = proj.image;
          }
        }
        if (!imageUrl && fallbackImage) {
          imageUrl = fallbackImage;
        }
        if (imageUrl) {
          avatar.style.backgroundImage = `url('${imageUrl}')`;
        }
      });
    }

    // ===== STATE =====
    let currentSort = 'compound';

    // ===== POSITIONING LOGIC =====
    function getProjectPositions(sortMode) {
      const containerWidth = 1100;
      const containerHeight = 550;
      const positions = [];

      if (sortMode === 'compound') {
        // Active × Stream: 2 rows (Active/Ongoing) × 3 columns (Gold/Silver/Bronze)
        const streams = ['gold', 'silver', 'bronze'];
        const colWidth = containerWidth / 3;
        const rowHeight = containerHeight / 2;

        projects.forEach((proj, idx) => {
          const colIndex = streams.indexOf(proj.stream);
          const rowIndex = proj.isActive ? 0 : 1;
          
          // Get projects in same cell for spacing
          const cellProjects = projects.filter(p => 
            p.stream === proj.stream && p.isActive === proj.isActive
          );
          const cellIndex = cellProjects.indexOf(proj);
          const cellCount = cellProjects.length;
          
          // Distribute within cell
          const cellX = colIndex * colWidth + colWidth / 2;
          const cellY = rowIndex * rowHeight + rowHeight / 2 + 20;
          
          // Offset based on position in cell
          const offsetX = (cellIndex - (cellCount - 1) / 2) * 90;
          const offsetY = (cellIndex % 2) * 40 - 20;

          positions.push({
            id: proj.id,
            x: cellX + offsetX,
            y: cellY + offsetY
          });
        });

      } else if (sortMode === 'stream') {
        // 3 columns: Gold | Silver | Bronze
        const streams = ['gold', 'silver', 'bronze'];
        const colWidth = containerWidth / 3;

        projects.forEach((proj, idx) => {
          const colIndex = streams.indexOf(proj.stream);
          const colProjects = projects.filter(p => p.stream === proj.stream);
          const posInCol = colProjects.indexOf(proj);
          
          const x = colIndex * colWidth + colWidth / 2;
          const y = 80 + posInCol * 85;

          positions.push({ id: proj.id, x, y });
        });

      } else if (sortMode === 'category') {
        // 4×2 grid of categories
        const cats = ['health', 'relationships', 'home', 'leisure', 'community', 'growth', 'finances', 'purpose'];
        const colWidth = containerWidth / 4;
        const rowHeight = containerHeight / 2;

        projects.forEach((proj, idx) => {
          const catIndex = cats.indexOf(proj.category);
          const col = catIndex % 4;
          const row = Math.floor(catIndex / 4);
          
          const catProjects = projects.filter(p => p.category === proj.category);
          const posInCat = catProjects.indexOf(proj);
          
          const x = col * colWidth + colWidth / 2 + (posInCat % 2) * 70 - 35;
          const y = row * rowHeight + 80 + Math.floor(posInCat / 2) * 80;

          positions.push({ id: proj.id, x, y });
        });

      } else if (sortMode === 'status') {
        // 2 rows: Active (top) | Ongoing (bottom)
        const rowHeight = containerHeight / 2;

        projects.forEach((proj, idx) => {
          const rowIndex = proj.isActive ? 0 : 1;
          const rowProjects = projects.filter(p => p.isActive === proj.isActive);
          const posInRow = rowProjects.indexOf(proj);
          
          const x = 80 + (posInRow % 8) * 130;
          const y = rowIndex * rowHeight + 80 + Math.floor(posInRow / 8) * 90;

          positions.push({ id: proj.id, x, y });
        });
      }

      return positions;
    }

    // ===== RENDER REGIONS =====
    function renderRegions(sortMode) {
      const regionsContainer = document.getElementById('sortRegions');
      const containerWidth = 1150;
      const containerHeight = 580;
      const offsetX = (window.innerWidth - containerWidth) / 2;
      
      let html = '';

      if (sortMode === 'compound') {
        // 2×3 grid: Active/Ongoing rows × Gold/Silver/Bronze columns
        const streams = ['gold', 'silver', 'bronze'];
        const streamLabels = ['Gold', 'Silver', 'Bronze'];
        const rows = ['Active', 'Ongoing'];
        const colWidth = containerWidth / 3;
        const rowHeight = containerHeight / 2;

        streams.forEach((stream, col) => {
          rows.forEach((row, rowIdx) => {
            html += `
              <div class="region ${stream}" style="
                left: ${offsetX + col * colWidth}px;
                top: ${170 + rowIdx * rowHeight}px;
                width: ${colWidth - 16}px;
                height: ${rowHeight - 16}px;
              ">
                <span class="region-label">${streamLabels[col]}</span>
                <span class="region-sublabel">${row}</span>
              </div>
            `;
          });
        });

      } else if (sortMode === 'stream') {
        const streams = ['gold', 'silver', 'bronze'];
        const streamLabels = ['Gold — Transformative', 'Silver — Capacity Building', 'Bronze — Operational'];
        const colWidth = containerWidth / 3;

        streams.forEach((stream, col) => {
          html += `
            <div class="region ${stream}" style="
              left: ${offsetX + col * colWidth}px;
              top: 170px;
              width: ${colWidth - 16}px;
              height: ${containerHeight - 16}px;
            ">
              <span class="region-label">${streamLabels[col]}</span>
            </div>
          `;
        });

      } else if (sortMode === 'category') {
        const cats = ['health', 'relationships', 'home', 'leisure', 'community', 'growth', 'finances', 'purpose'];
        const catLabels = ['Health', 'Relationships', 'Home', 'Leisure', 'Community', 'Growth', 'Finances', 'Purpose'];
        const colWidth = containerWidth / 4;
        const rowHeight = containerHeight / 2;

        cats.forEach((cat, idx) => {
          const col = idx % 4;
          const row = Math.floor(idx / 4);
          html += `
            <div class="region cat-${cat}" style="
              left: ${offsetX + col * colWidth}px;
              top: ${170 + row * rowHeight}px;
              width: ${colWidth - 16}px;
              height: ${rowHeight - 16}px;
            ">
              <span class="region-label">${catLabels[idx]}</span>
            </div>
          `;
        });

      } else if (sortMode === 'status') {
        const rowHeight = containerHeight / 2;
        
        html += `
          <div class="region active-region" style="
            left: ${offsetX}px;
            top: 170px;
            width: ${containerWidth - 16}px;
            height: ${rowHeight - 16}px;
          ">
            <span class="region-label">⚡ Active — On The Table</span>
          </div>
          <div class="region ongoing-region" style="
            left: ${offsetX}px;
            top: ${170 + rowHeight}px;
            width: ${containerWidth - 16}px;
            height: ${rowHeight - 16}px;
          ">
            <span class="region-label">🌱 Ongoing — Planted Projects</span>
          </div>
        `;
      }

      regionsContainer.innerHTML = html;
    }

    // ===== RENDER PROJECTS =====
    function renderProjects() {
      const container = document.getElementById('projectsContainer');
      const positions = getProjectPositions(currentSort);
      
      container.innerHTML = projects.map((proj, idx) => {
        const pos = positions.find(p => p.id === proj.id);
        const color = categoryColors[proj.category];
        const gradient = generateGradient(idx, color);
        
        return `
          <div class="project-dot size-${proj.scale} stream-${proj.stream} ${proj.status} ${proj.workAtHand ? 'work-at-hand' : ''}"
               style="--project-color: ${color}; left: ${pos.x}px; top: ${pos.y}px; transform: translate(-50%, -50%)"
               onclick="openBoard('${proj.id}')"
               data-id="${proj.id}">
            <div class="project-image" style="background-image: url('${proj.image}')"></div>
            <div class="gradient-fill" style="background: ${gradient}"></div>
            <div class="category-indicator"></div>
            <span class="hover-label">${proj.name}</span>
          </div>
        `;
      }).join('');
    }

    // ===== PROJECT BOARD =====
    function openBoard(projectId) {
      const proj = projects.find(p => p.id === projectId);
      const color = categoryColors[proj.category];
      const gradient = generateGradient(projects.indexOf(proj), color);
      
      const board = document.getElementById('projectBoard');
      board.style.setProperty('--project-color', color);
      
      board.innerHTML = `
        <button class="close-board" onclick="closeBoard()">×</button>
        <div class="board-header">
          <div class="board-image">
            <div class="project-image" style="background-image: url('${proj.image}')"></div>
            <div class="gradient-fill" style="background: ${gradient}; width: 100%; height: 100%;"></div>
          </div>
          <div class="board-title-section">
            <div class="board-project-title stream-${proj.stream}">${proj.name}</div>
            <div class="board-meta">
              <span class="board-category-badge" style="background: ${color}">${categoryNames[proj.category]}</span>
              <span class="board-stream-badge ${proj.stream}">${proj.stream}</span>
              ${proj.workAtHand ? '<span style="color: var(--gold)">★ On The Table</span>' : ''}
            </div>
          </div>
          <div class="board-progress">
            <div class="board-progress-value">${proj.progress}%</div>
            <div class="board-progress-label">Complete</div>
          </div>
        </div>
        <div class="kanban-board">
          <div class="kanban-column">
            <div class="column-header">To Do (${proj.tasks.todo.length})</div>
            ${proj.tasks.todo.map(t => `<div class="task-card">${t}</div>`).join('')}
          </div>
          <div class="kanban-column">
            <div class="column-header">In Progress (${proj.tasks.inProgress.length})</div>
            ${proj.tasks.inProgress.map(t => `<div class="task-card">${t}</div>`).join('')}
          </div>
          <div class="kanban-column">
            <div class="column-header">Done (${proj.tasks.done.length})</div>
            ${proj.tasks.done.map(t => `<div class="task-card">${t}</div>`).join('')}
          </div>
        </div>
      `;
      
      document.getElementById('projectBoardOverlay').classList.add('active');
    }

    function closeBoard() {
      document.getElementById('projectBoardOverlay').classList.remove('active');
    }

    // ===== SORT CONTROL HANDLERS =====
    document.querySelectorAll('.sort-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        renderRegions(currentSort);
        renderProjects();
      });
    });

    // Close board on overlay click
    document.getElementById('projectBoardOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeBoard();
    });

    // ESC to close
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeBoard();
    });

    // ===== INIT =====
    renderRegions(currentSort);
    renderProjects();
    applyTableImages();
  </script>
