<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeBuild — Become the Director of Your Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Warm neutrals foundation */
            --bg-deep: #1a1815;
            --bg-warm: #252220;
            --bg-surface: #2d2a27;
            --bg-elevated: #3a3633;
            
            --text-primary: #f5f0eb;
            --text-secondary: #b8b0a6;
            --text-muted: #8a8279;
            
            /* Life Category colors */
            --health: #4a9e6d;
            --purpose: #7b68a6;
            --finances: #c9a227;
            --relationships: #d4727a;
            --home: #b86f4c;
            --community: #d68c45;
            --leisure: #5a9bc7;
            --growth: #3d9490;
            
            /* Stream accents */
            --gold: #d4a84b;
            --silver: #9ca3af;
            --bronze: #b87a4b;
            
            /* Big 3 Agent colors */
            --jarvis-primary: #7b68a6;
            --jarvis-secondary: #9580c4;
            --marvin-primary: #d4a84b;
            --marvin-secondary: #e8b85a;
            --conan-primary: #3d9490;
            --conan-secondary: #4db0ab;
            
            /* UI */
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Source Sans 3', system-ui, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            overflow: hidden;
            line-height: 1.6;
        }

        /* Ambient background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: drift 20s ease-in-out infinite;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--purpose);
            top: -100px;
            right: -100px;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--gold);
            bottom: -50px;
            left: -50px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: var(--health);
            top: 50%;
            left: 30%;
            animation-delay: -14s;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -20px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* Grain overlay */
        .grain {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* Screen container */
        .screen {
            position: absolute;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            z-index: 1;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
        }

        .content {
            text-align: center;
            max-width: 720px;
            padding: 40px;
            position: relative;
        }

        /* Typography */
        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            line-height: 1.1;
        }

        h2 {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.5rem, 4vw, 2.25rem);
            font-weight: 400;
            letter-spacing: -0.01em;
            margin-bottom: 1.5rem;
            line-height: 1.3;
            color: var(--text-primary);
        }

        p {
            font-size: 1.125rem;
            color: var(--text-secondary);
            max-width: 560px;
            margin: 0 auto;
        }

        .subhead {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
        }

        .highlight {
            color: var(--gold);
            font-weight: 500;
        }

        /* Logo animation */
        .logo-reveal {
            font-family: 'Fraunces', serif;
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--gold) 50%, var(--text-primary) 100%);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ======================== */
        /* SCREEN 1: EMPIRES INTRO  */
        /* ======================== */
        .intro-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .intro-image-shell {
            width: min(520px, 80vw);
            aspect-ratio: 1.2;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.35);
            background: rgba(0, 0, 0, 0.3);
        }

        .intro-image-shell img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .intro-image-shell img.visible {
            opacity: 1;
        }

        .zoom-label {
            position: absolute;
            right: 14%;
            bottom: 28%;
            padding: 10px 20px;
            border-radius: 26px;
            background: rgba(255, 244, 233, 0.92);
            color: #b05a62;
            font-weight: 600;
            letter-spacing: 0.05em;
            font-size: 0.95rem;
            text-transform: uppercase;
            min-width: 150px;
            text-align: center;
            box-shadow: 0 18px 32px rgba(0, 0, 0, 0.35);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
            pointer-events: none;
        }

        .zoom-label.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .zoom-label.glow {
            box-shadow: 0 0 28px rgba(212, 168, 75, 0.65);
        }

        .intro-script {
            text-align: center;
            max-width: 640px;
        }

        .intro-script h2 {
            margin-bottom: 0.5rem;
            font-style: normal;
        }

        .intro-progress {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            margin-bottom: 36px;
        }

        .intro-progress span {
            width: 36px;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.3s ease;
        }

        .intro-progress span.active {
            background: var(--gold);
        }

        /* ========================== */
        /* SCREEN 4: AI WORKERS       */
        /* ========================== */

        .workers-viz {
            margin: 2rem auto;
            max-width: 420px;
        }

        .chat-bubble {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            opacity: 0;
            transform: translateX(-20px);
        }

        .chat-bubble.ai {
            flex-direction: row-reverse;
            transform: translateX(20px);
        }

        .chat-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .chat-bubble.human .chat-avatar {
            background: linear-gradient(135deg, var(--relationships) 0%, #b05a62 100%);
        }

        .chat-bubble.ai .chat-avatar {
            background: linear-gradient(135deg, var(--leisure) 0%, var(--growth) 100%);
        }

        .chat-content {
            background: var(--bg-surface);
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 300px;
            text-align: left;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .chat-bubble.ai .chat-content {
            background: rgba(90, 155, 199, 0.1);
            border-color: rgba(90, 155, 199, 0.2);
        }

        .chat-name {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .chat-text {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .chat-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .reminder-card {
            background: var(--bg-surface);
            border: 1px solid rgba(212, 168, 75, 0.3);
            border-radius: 10px;
            padding: 14px 16px;
            margin-top: 14px;
            opacity: 0;
            transform: translateY(10px);
        }

        .reminder-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .reminder-icon {
            font-size: 1.1rem;
        }

        .reminder-title {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .reminder-text {
            font-size: 0.95rem;
            color: var(--text-primary);
        }

        .reminder-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .reminder-btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .reminder-btn.primary {
            background: var(--gold);
            color: var(--bg-deep);
        }

        .reminder-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-secondary);
        }

        /* ========================== */
        /* SCREEN 5: AI ADVISORS      */
        /* ========================== */

        .advisors-viz {
            margin: 2rem auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
        }

        .insight-card {
            display: flex;
            gap: 14px;
            background: var(--bg-surface);
            border-radius: 10px;
            padding: 14px 16px;
            text-align: left;
            opacity: 0;
            transform: translateY(15px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .insight-domain {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .insight-card.health .insight-domain {
            background: linear-gradient(135deg, rgba(74, 158, 109, 0.3), rgba(74, 158, 109, 0.1));
            border: 1px solid var(--health);
        }

        .insight-card.home .insight-domain {
            background: linear-gradient(135deg, rgba(184, 111, 76, 0.3), rgba(184, 111, 76, 0.1));
            border: 1px solid var(--home);
        }

        .insight-card.purpose .insight-domain {
            background: linear-gradient(135deg, rgba(123, 104, 166, 0.3), rgba(123, 104, 166, 0.1));
            border: 1px solid var(--purpose);
        }

        .insight-content {
            flex: 1;
        }

        .insight-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .insight-text {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.4;
        }

        .insight-text em {
            color: var(--gold);
            font-style: normal;
            font-weight: 500;
        }

        /* ================================ */
        /* SCREEN 6: ARCHITECTURE           */
        /* ================================ */

        /* ========================== */
        /* SCREENS 7-9: BIG 3 AGENTS  */
        /* ========================== */

        /* (Agent showcase styles removed with retired screens) */

        /* ============= */
        /* SCREEN 10: CTA */
        /* ============= */

        .cta-statement {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            font-weight: 400;
            line-height: 1.6;
            color: var(--text-primary);
            margin-bottom: 2rem;
        }

        .cta-statement span {
            display: block;
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            background: var(--gold);
            color: var(--bg-deep);
            font-family: 'Source Sans 3', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background: var(--text-primary);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px -8px rgba(212, 168, 75, 0.4);
        }

        .cta-btn svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }

        .cta-btn:hover svg {
            transform: translateX(4px);
        }

        /* ============= */
        /* NAVIGATION    */
        /* ============= */

        .nav-container {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 100;
        }

        .nav-btn {
            padding: 12px 24px;
            background: var(--bg-surface);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50px;
            color: var(--text-secondary);
            font-family: 'Source Sans 3', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-color: rgba(255,255,255,0.2);
        }

        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .nav-btn.pulse {
            animation: nextPulse 0.9s ease-in-out infinite alternate;
        }

        @keyframes nextPulse {
            0% {
                box-shadow: 0 0 0 rgba(212, 168, 75, 0.2);
            }
            100% {
                box-shadow: 0 0 18px rgba(212, 168, 75, 0.6);
            }
        }

        .progress-dots {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 100;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.3;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: var(--gold);
            opacity: 1;
            transform: scale(1.3);
        }

        .dot:hover:not(.active) {
            opacity: 0.6;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .content { padding: 24px; }
            .empire-scene { width: 320px; height: 200px; }
            .settlement { width: 240px; height: 140px; }
            .resource-bar { gap: 12px; padding: 6px 12px; }
            .resource { font-size: 0.7rem; }
            .life-map-viz { width: 300px; height: 200px; }
            .workers-viz { max-width: 340px; }
            .chat-content { max-width: 240px; }
            .advisors-viz { max-width: 340px; }
            .architecture-viz { width: 300px; height: 260px; }
            .agent-showcase { max-width: 340px; }
            .marvin-workflow { flex-wrap: wrap; }
            .progress-dots { gap: 6px; }
            .dot { width: 6px; height: 6px; }
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="ambient-orb orb-1"></div>
        <div class="ambient-orb orb-2"></div>
        <div class="ambient-orb orb-3"></div>
    </div>
    <div class="grain"></div>

    <!-- SCREEN 1: Empire Nostalgia -->
    <div class="screen active" id="screen1">
        <div class="content">
            <div class="intro-script">
                <h2 id="introHeadline">You used to build empires.</h2>
            </div>

            <div class="intro-frame">
                <div class="intro-image-shell">
                    <img id="introImage" src="./lifebuild-director/empires1.png" alt="LifeBuild empire memories">
                </div>
                <div class="intro-progress" id="introProgress"></div>
            </div>
        </div>
    </div>

    <!-- SCREEN 2: Product Reveal -->
    <div class="screen" id="screen2">
        <div class="content">
            <div class="intro-script">
                <h2>Until now.</h2>
            </div>

            <div class="intro-frame">
                <div class="intro-image-shell">
                    <img id="upgradeImage" src="./lifebuild-director/act2-1.jpg" alt="LifeBuild automation sequence">
                </div>
                <div class="intro-progress" id="upgradeProgress"></div>
            </div>
        </div>
    </div>

    <!-- SCREEN 3: Map Reveal -->
    <div class="screen" id="screen3">
        <div class="content">
            <div class="intro-script">
                <h2>Your personal life — as a map.</h2>
            </div>

            <div class="intro-frame">
                <div class="intro-image-shell">
                    <img id="mapImage" src="./lifebuild-director/act3-1.jpg" alt="LifeBuild map reveal">
                </div>
                <div class="intro-progress" id="mapProgress"></div>
            </div>
        </div>
    </div>

    <!-- SCREEN 4: AI Advisors -->
    <div class="screen" id="screen4">
        <div class="content">
            <h2>Direct a corps of AI advisors, managers, & workers.</h2>

            <div class="intro-frame">
                <div class="intro-image-shell">
                    <img class="visible" src="./lifebuild-director/act4-team.jpg" alt="AI advisor lineup">
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 5: Map Zoom -->
    <div class="screen" id="screen5">
        <div class="content">
            <div class="intro-script">
                <h2>Easily zoom in.</h2>
            </div>

            <div class="intro-frame">
                <div class="intro-image-shell">
                    <img id="zoomImage" src="./lifebuild-director/zoom-1.jpg" alt="Zooming into the map">
                    <div class="zoom-label" id="zoomLabel">Date Nights</div>
                </div>
                <div class="intro-progress" id="zoomProgress"></div>
            </div>
        </div>
    </div>

    <div class="screen" id="screen6">
        <div class="content">
            <div class="intro-script">
                <h2>To the past, present, and future.</h2>
            </div>

            <div class="intro-frame">
                <div class="intro-image-shell">
                    <img class="visible" src="./lifebuild-director/act5-finale.jpg" alt="LifeBuild finale">
                </div>
            </div>
        </div>
    </div>

    <!-- SCREEN 7: CTA -->
    <div class="screen" id="screen7">
        <div class="content">
            <div class="cta-statement">
                <span>Map your life.</span>
                <span>Staff it with AI.</span>
                <span>Build your empire—one project at a time.</span>
            </div>
            
            <button class="cta-btn" onclick="startJourney()">
                Start Building
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Navigation -->
    <div class="progress-dots">
        <div class="dot active" data-screen="1"></div>
        <div class="dot" data-screen="2"></div>
        <div class="dot" data-screen="3"></div>
        <div class="dot" data-screen="4"></div>
        <div class="dot" data-screen="5"></div>
        <div class="dot" data-screen="6"></div>
        <div class="dot" data-screen="7"></div>
    </div>

    <div class="nav-container">
        <button class="nav-btn" onclick="previousScreen()" id="prevBtn" disabled>← Back</button>
        <button class="nav-btn" onclick="nextScreen()" id="nextBtn">Next →</button>
</div>

    <script>
        let currentScreen = 1;
        const totalScreens = 7;
        const prevButton = document.getElementById('prevBtn');
        const nextButton = document.getElementById('nextBtn');
        const introElements = {
            headline: document.getElementById('introHeadline'),
            image: document.getElementById('introImage'),
            progress: document.getElementById('introProgress')
        };
        const upgradeElements = {
            image: document.getElementById('upgradeImage'),
            progress: document.getElementById('upgradeProgress')
        };
        const mapElements = {
            image: document.getElementById('mapImage'),
            progress: document.getElementById('mapProgress')
        };
        const zoomElements = {
            image: document.getElementById('zoomImage'),
            progress: document.getElementById('zoomProgress'),
            label: document.getElementById('zoomLabel')
        };
        const introSequences = [
            { headline: "You used to build empires.", images: ["./lifebuild-director/empires1.png"] },
            { images: ["./lifebuild-director/empires2.png", "./lifebuild-director/empires3.png"] },
            { images: ["./lifebuild-director/empires4.png", "./lifebuild-director/empires5.png"] },
            { headline: "But life didn't come with missions, minions, or minimaps.", images: ["./lifebuild-director/empires6.png"] }
        ];
        const upgradeSequenceImages = [
            "./lifebuild-director/act2-1.jpg",
            "./lifebuild-director/act2-2.jpg",
            "./lifebuild-director/act2-3.jpg",
            "./lifebuild-director/act2-4.jpg",
            "./lifebuild-director/act2-5.jpg",
            "./lifebuild-director/act2-6.jpg"
        ];
        const mapSequenceImages = [
            "./lifebuild-director/act3-1.jpg",
            "./lifebuild-director/act3-2.jpg",
            "./lifebuild-director/act3-3.jpg"
        ];
        const zoomSequenceImages = [
            "./lifebuild-director/zoom-1.jpg",
            "./lifebuild-director/zoom-2.jpg",
            "./lifebuild-director/zoom-3.jpg",
            "./lifebuild-director/zoom-4.jpg"
        ];
        let introTimeouts = [];
        let introSequenceIndex = 0;
        let upgradeTimeouts = [];
        let upgradeImageIndex = 0;
        let mapTimeouts = [];
        let mapImageIndex = 0;
        let zoomTimeouts = [];
        let zoomImageIndex = 0;
        let navigationLocked = false;

        function lockNext() {
            navigationLocked = true;
            nextButton.classList.remove('pulse');
            if (nextButton.style.display !== 'none') {
                nextButton.disabled = true;
            }
        }

        function unlockNext() {
            navigationLocked = false;
            if (nextButton.style.display === 'none') {
                return;
            }
            nextButton.disabled = false;
            nextButton.classList.add('pulse');
        }

        function showScreen(screenNum) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(`screen${screenNum}`).classList.add('active');
            document.querySelectorAll('.dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === screenNum - 1);
            });
            prevButton.disabled = screenNum === 1;
            const isFinalScreen = screenNum === totalScreens;
            nextButton.style.display = isFinalScreen ? 'none' : 'block';
            if (isFinalScreen) {
                nextButton.disabled = true;
                nextButton.classList.remove('pulse');
            }
            lockNext();

            setTimeout(() => {
                let handled = false;
                if (screenNum === 1) {
                    handled = true;
                    runIntroSequence();
                } else {
                    resetIntroSequence();
                }
                if (screenNum === 2) {
                    handled = true;
                    runUpgradeSequence();
                } else {
                    resetUpgradeSequence();
                }
                if (screenNum === 3) {
                    handled = true;
                    runMapSequence();
                } else {
                    resetMapSequence();
                }
                if (screenNum === 5) {
                    handled = true;
                    runZoomSequence();
                } else {
                    resetZoomSequence();
                }
                if (!handled) {
                    unlockNext();
                }
            }, 200);
        }

        function nextScreen() {
            if (navigationLocked) return;
            if (currentScreen < totalScreens) {
                currentScreen++;
                showScreen(currentScreen);
            }
        }

        function previousScreen() {
            if (currentScreen > 1) {
                currentScreen--;
                showScreen(currentScreen);
            }
        }

        document.querySelectorAll('.dot').forEach(dot => {
            dot.addEventListener('click', () => {
                const targetScreen = parseInt(dot.dataset.screen, 10);
                if (Number.isNaN(targetScreen)) return;
                if (navigationLocked && targetScreen > currentScreen) return;
                currentScreen = targetScreen;
                showScreen(currentScreen);
            });
        });

        function resetIntroSequence() {
            introTimeouts.forEach(clearTimeout);
            introTimeouts = [];
            introSequenceIndex = 0;
            if (introElements.progress) {
                Array.from(introElements.progress.children).forEach(dot => dot.classList.remove('active'));
            }
        }

        function runIntroSequence() {
            if (!introElements.image) return;
            resetIntroSequence();
            if (introElements.progress && introElements.progress.children.length === 0) {
                introElements.progress.innerHTML = introSequences.map(() => '<span></span>').join('');
            }
            playIntroStep();
        }

        function playIntroStep() {
            if (!introElements.image) return;
            if (introSequenceIndex >= introSequences.length) {
                unlockNext();
                return;
            }

            const sequence = introSequences[introSequenceIndex];
            if (sequence.headline) {
                introElements.headline.textContent = sequence.headline;
            }
            if (introElements.progress) {
                Array.from(introElements.progress.children).forEach((dot, index) => {
                    dot.classList.toggle('active', index === introSequenceIndex);
                });
            }

            let imageIndex = 0;
            const perImageDuration = sequence.images.length > 1 ? 1200 : 2000;
            const finalHold = sequence.images.length > 1 ? 400 : 800;

            const showImage = () => {
                introElements.image.classList.remove('visible');
                introTimeouts.push(setTimeout(() => {
                    introElements.image.src = sequence.images[imageIndex];
                }, 60));
                const onLoad = () => {
                    introElements.image.classList.add('visible');
                    introElements.image.removeEventListener('load', onLoad);
                };
                introElements.image.addEventListener('load', onLoad);
            };

            const advance = () => {
                imageIndex++;
                if (imageIndex < sequence.images.length) {
                    showImage();
                    introTimeouts.push(setTimeout(advance, perImageDuration));
                } else {
                    introSequenceIndex++;
                    introTimeouts.push(setTimeout(() => playIntroStep(), finalHold));
                }
            };

            showImage();
            introTimeouts.push(setTimeout(advance, perImageDuration));
        }

        function resetUpgradeSequence() {
            upgradeTimeouts.forEach(clearTimeout);
            upgradeTimeouts = [];
            upgradeImageIndex = 0;
            if (upgradeElements.progress) {
                Array.from(upgradeElements.progress.children).forEach(dot => dot.classList.remove('active'));
            }
        }

        function runUpgradeSequence() {
            if (!upgradeElements.image) return;
            resetUpgradeSequence();
            if (upgradeElements.progress && upgradeElements.progress.children.length === 0) {
                upgradeElements.progress.innerHTML = upgradeSequenceImages.map(() => '<span></span>').join('');
            }
            playUpgradeStep();
        }

        function playUpgradeStep() {
            if (!upgradeElements.image) return;
            if (upgradeImageIndex >= upgradeSequenceImages.length) {
                unlockNext();
                return;
            }

            const src = upgradeSequenceImages[upgradeImageIndex];
            upgradeElements.image.classList.remove('visible');
            upgradeTimeouts.push(setTimeout(() => {
                upgradeElements.image.src = src;
            }, 60));
            const onLoad = () => {
                upgradeElements.image.classList.add('visible');
                upgradeElements.image.removeEventListener('load', onLoad);
            };
            upgradeElements.image.addEventListener('load', onLoad);

            if (upgradeElements.progress) {
                Array.from(upgradeElements.progress.children).forEach((dot, index) => {
                    dot.classList.toggle('active', index === upgradeImageIndex);
                });
            }

            const hold = 1400;
            upgradeTimeouts.push(setTimeout(() => {
                upgradeImageIndex++;
                playUpgradeStep();
            }, hold));
        }

        function resetMapSequence() {
            mapTimeouts.forEach(clearTimeout);
            mapTimeouts = [];
            mapImageIndex = 0;
            if (mapElements.progress) {
                Array.from(mapElements.progress.children).forEach(dot => dot.classList.remove('active'));
            }
        }

        function runMapSequence() {
            if (!mapElements.image) return;
            resetMapSequence();
            if (mapElements.progress && mapElements.progress.children.length === 0) {
                mapElements.progress.innerHTML = mapSequenceImages.map(() => '<span></span>').join('');
            }
            playMapStep();
        }

        function playMapStep() {
            if (!mapElements.image) return;
            if (mapImageIndex >= mapSequenceImages.length) {
                unlockNext();
                return;
            }

            const src = mapSequenceImages[mapImageIndex];
            mapElements.image.classList.remove('visible');
            mapTimeouts.push(setTimeout(() => {
                mapElements.image.src = src;
            }, 60));
            const onLoad = () => {
                mapElements.image.classList.add('visible');
                mapElements.image.removeEventListener('load', onLoad);
            };
            mapElements.image.addEventListener('load', onLoad);

            if (mapElements.progress) {
                Array.from(mapElements.progress.children).forEach((dot, index) => {
                    dot.classList.toggle('active', index === mapImageIndex);
                });
            }

            const hold = 1500;
            mapTimeouts.push(setTimeout(() => {
                mapImageIndex++;
                playMapStep();
            }, hold));
        }

        function resetZoomSequence() {
            zoomTimeouts.forEach(clearTimeout);
            zoomTimeouts = [];
            zoomImageIndex = 0;
            if (zoomElements.progress) {
                Array.from(zoomElements.progress.children).forEach(dot => dot.classList.remove('active'));
            }
            setZoomLabelState('hide');
        }

        function runZoomSequence() {
            if (!zoomElements.image) return;
            resetZoomSequence();
            if (zoomElements.progress && zoomElements.progress.children.length === 0) {
                zoomElements.progress.innerHTML = zoomSequenceImages.map(() => '<span></span>').join('');
            }
            playZoomStep();
        }

        function setZoomLabelState(state) {
            if (!zoomElements.label) return;
            zoomElements.label.classList.remove('visible', 'glow');
            if (state === 'show') {
                zoomElements.label.classList.add('visible');
            } else if (state === 'glow') {
                zoomElements.label.classList.add('visible', 'glow');
            }
        }

        function playZoomStep() {
            if (!zoomElements.image) return;
            if (zoomImageIndex >= zoomSequenceImages.length) {
                setZoomLabelState('glow');
                unlockNext();
                return;
            }

            const src = zoomSequenceImages[zoomImageIndex];
            zoomElements.image.classList.remove('visible');
            zoomTimeouts.push(setTimeout(() => {
                zoomElements.image.src = src;
            }, 60));
            const onLoad = () => {
                zoomElements.image.classList.add('visible');
                zoomElements.image.removeEventListener('load', onLoad);
                if (zoomImageIndex >= 2) {
                    const isFinalFrame = zoomImageIndex === zoomSequenceImages.length - 1;
                    setZoomLabelState(isFinalFrame ? 'glow' : 'show');
                } else {
                    setZoomLabelState('hide');
                }
            };
            zoomElements.image.addEventListener('load', onLoad);

            if (zoomElements.progress) {
                Array.from(zoomElements.progress.children).forEach((dot, index) => {
                    dot.classList.toggle('active', index === zoomImageIndex);
                });
            }

            const hold = 1500;
            zoomTimeouts.push(setTimeout(() => {
                zoomImageIndex++;
                playZoomStep();
            }, hold));
        }

        function startJourney() {
            alert("Welcome to LifeBuild! Let's begin building your empire...");
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                if (navigationLocked) return;
                nextScreen();
            }
            if (e.key === 'ArrowLeft') previousScreen();
        });

        showScreen(1);
    </script>
</body>
</html>
