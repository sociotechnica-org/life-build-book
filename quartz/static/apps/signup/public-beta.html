<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Beta — LifeBuild</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,400&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/apps/signup/_shared.css">
</head>
<body>
  <div class="signup-container">
    <div class="signup-card">
      <div class="tier-badge">Public Beta</div>
      <h1>First in line for the beta.</h1>
      <p class="welcome-text">
        We'll let you know when LifeBuild is stable, polished, and ready for a wider crew.
      </p>

      <form
        action="https://buttondown.com/api/emails/embed-subscribe/sociotechnica"
        method="post"
        target="_blank"
        class="signup-form"
      >
        <div class="form-group">
          <label for="full_name">Full name</label>
          <input
            type="text"
            id="full_name"
            name="metadata__full_name"
            placeholder="First and last"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="found_you">How did you find us? <span class="optional">(optional)</span></label>
          <input
            type="text"
            id="found_you"
            name="metadata__found_you"
            placeholder="Friend, podcast, Twitter, etc."
          >
        </div>

        <div class="form-group">
          <label for="why_joining">Why are you joining? <span class="optional">(optional)</span></label>
          <textarea
            id="why_joining"
            name="metadata__why_joining"
            placeholder="What will you build or manage with LifeBuild?"
          ></textarea>
        </div>

        <input type="hidden" name="tag" value="public-beta">
        <input type="hidden" name="embed" value="1">

        <div class="submit-row">
          <button type="submit">Notify me</button>
          <span class="helper-text">We will email when the beta opens.</span>
        </div>
      </form>

      <a href="https://lifebuild.me" class="back-link">← Back to LifeBuild</a>
    </div>
  </div>
</body>
</html>
