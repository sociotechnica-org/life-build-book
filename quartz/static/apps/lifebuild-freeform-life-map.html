<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeBuild - Freeform Life Map</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --health: #4CAF50;
      --purpose: #5C4B8A;
      --finances: #D4A017;
      --relationships: #E57373;
      --home: #A1887F;
      --community: #FF7043;
      --leisure: #64B5F6;
      --growth: #26A69A;

      --gold: #D4A017;
      --gold-light: #F4D03F;
      --silver: #C0C0C0;
      --silver-light: #E8E8E8;
      --bronze: #CD7F32;
      --bronze-light: #DDA15E;

      --bg-dark: #1a1a1a;
      --bg-card: #2a2a2a;
      --bg-panel: #222;
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
    }

    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 8px var(--gold), 0 0 16px rgba(212, 160, 23, 0.3); }
      50% { box-shadow: 0 0 16px var(--gold), 0 0 32px rgba(212, 160, 23, 0.5); }
    }

    @keyframes pulse-silver {
      0%, 100% { box-shadow: 0 0 8px var(--silver), 0 0 16px rgba(192, 192, 192, 0.3); }
      50% { box-shadow: 0 0 16px var(--silver), 0 0 32px rgba(192, 192, 192, 0.5); }
    }

    /* ===== LEFT PANEL ===== */
    .project-palette {
      width: 240px;
      height: 100vh;
      background: var(--bg-panel);
      border-right: 1px solid rgba(255,255,255,0.1);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .palette-header {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .palette-title {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sort-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .sort-btn {
      padding: 4px 8px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      color: var(--text-secondary);
      font-size: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sort-btn:hover {
      border-color: rgba(255,255,255,0.4);
      color: var(--text-primary);
    }

    .sort-btn.active {
      background: rgba(255,255,255,0.1);
      border-color: var(--text-primary);
      color: var(--text-primary);
    }

    .palette-projects {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .palette-section {
      margin-bottom: 12px;
    }

    .palette-section-title {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 5px;
      padding-left: 4px;
    }

    .palette-project {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--bg-card);
      border-radius: 8px;
      margin-bottom: 5px;
      cursor: grab;
      transition: all 0.2s ease;
      border: 2px solid transparent;
      user-select: none;
    }

    .palette-project:hover {
      background: #333;
      transform: translateX(2px);
    }

    .palette-project.dragging {
      opacity: 0.5;
    }

    .palette-project.on-map {
      opacity: 0.3;
      border-style: dashed;
      border-color: rgba(255,255,255,0.1);
    }

    .palette-project-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 2px solid var(--project-color);
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .palette-project-dot.size-large { width: 34px; height: 34px; }
    .palette-project-dot.size-small { width: 22px; height: 22px; }

    .palette-project-info { flex: 1; min-width: 0; }

    .palette-project-name {
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .palette-project-name.stream-gold { color: var(--gold-light); }
    .palette-project-name.stream-silver { color: var(--silver-light); }
    .palette-project-name.stream-bronze { color: var(--bronze-light); }

    .palette-project-meta {
      font-size: 8px;
      color: var(--text-secondary);
    }

    /* ===== MAIN CANVAS ===== */
    .map-canvas {
      flex: 1;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--bg-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
